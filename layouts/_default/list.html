{{ define "main" }}
  <div class="container markdown top-pad">
    {{ .Content }}
  </div>
  <div class="container">
    <ul>
      {{ range .Pages.ByPublishDate.Reverse }}
        <li>
          <a href="{{ .Permalink }}">
            {{ if .Date }}{{ .Date.Format (.Site.Params.dateFormat | default ":date_medium") }} | {{ end }}
            {{ .Title | markdownify }}
          </a>
        </li>
      {{ end }}
    </ul>
  </div>
{{ end }}
